<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مساعدي AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .app {
            max-width: 900px;
            height: 100vh;
            margin: auto;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 6px 0 0;
            color: #777;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            margin-bottom: 15px;
            border-radius: 18px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user {
            margin-right: auto;
            background: #2563eb;
            color: white;
        }

        .ai {
            margin-left: auto;
            background: white;
            border: 1px solid #ddd;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
        }

        textarea {
            flex: 1;
            height: 55px;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #2563eb;
        }

        button {
            width: 90px;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .loading {
            color: #777;
        }

        @media (max-width: 600px) {
            .message {
                max-width: 92%;
            }

            button {
                width: 75px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <h1>🤖 مساعدي AI</h1>
        <p>مساعدك الذكي بواسطة GPT-OSS</p>
    </header>

    <main id="chat">

        <div class="message ai">
            مرحباً بك 👋

            أنا مساعدك الذكي.
            اكتب سؤالك وسأحاول مساعدتك.
        </div>

    </main>

    <div class="input-area">

        <textarea
            id="message"
            placeholder="اكتب سؤالك هنا..."
        ></textarea>

        <button id="send">
            إرسال
        </button>

    </div>

</div>

<script>

const messageInput = document.getElementById("message");
const sendButton = document.getElementById("send");
const chat = document.getElementById("chat");


function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}


async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage(message, "user");

    messageInput.value = "";

    sendButton.disabled = true;

    sendButton.textContent = "...";


    const loadingMessage = addMessage(
        "جاري التفكير...",
        "ai loading"
    );


    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


        const data = await response.json();

        loadingMessage.remove();


        if (data.answer) {

            addMessage(
                data.answer,
                "ai"
            );

        } else {

            addMessage(
                "حدث خطأ: " + (data.error || "خطأ غير معروف"),
                "ai"
            );

        }


    } catch (error) {

        loadingMessage.remove();

        addMessage(
            "تعذر الاتصال بالخادم.",
            "ai"
        );

    }


    sendButton.disabled = false;

    sendButton.textContent = "إرسال";
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>

</body>

</html>
